data:
  train_metadata: data/processed/products_64/train.jsonl
  valid_metadata: data/processed/products_64/valid.jsonl
  image_size: 64

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

model:
  in_channels: 3
  out_channels: 3
  base_channels: 64 
  time_embedding_dim: 128
  time_dim: 256

training:
  batch_size: 8
  learning_rate: 0.0002
  epochs: 100
  seed: 42
  num_workers: 0
  checkpoint_interval: 10
  sample_interval: 20
  num_sample_images: 4

overfit_one_image:
  steps: 1000
  log_interval: 50


overfit_minibatch:
  num_images: 8
  steps: 1500
  log_interval: 50